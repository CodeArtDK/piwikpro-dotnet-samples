<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiwikPRO Analytics Browser</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Material+Icons&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script>
        // Read active connection from localStorage before Blazor starts
        // This allows Program.cs to access the connection configuration via JS interop
        window.piwikproConnection = (function() {
            try {
                var activeId = localStorage.getItem('piwikpro_active_connection');
                if (!activeId) return null;
                
                var connectionsJson = localStorage.getItem('piwikpro_connections');
                if (!connectionsJson) return null;
                
                var connections = JSON.parse(connectionsJson);
                var active = connections.find(function(c) { return c.Id === activeId; });
                return active || null;
            } catch (e) {
                console.error('Error reading active connection:', e);
                return null;
            }
        })();
        
        // Function to get the active connection (can be called from Blazor)
        window.getActiveConnection = function() {
            return window.piwikproConnection;
        };
    </script>
</head>

<body>
    <div id="app">
        <div style="position:absolute; top:30vh; width:100%; text-align:center">
            <h1 style="color:#0d47a1; font-family: Roboto, sans-serif;">PiwikPRO Analytics</h1>
            <p style="color:#666; font-family: Roboto, sans-serif;">Loading...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/livemap.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
